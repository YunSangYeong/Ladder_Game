<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>귀여운 사다리타기 게임</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    
    * { box-sizing: border-box; font-family: 'Jua', sans-serif; }
    body {
      background-color: #fff9e6;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0; padding: 20px;
    }
    .card {
      background: white; border-radius: 20px; padding: 25px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
      text-align: center; max-width: 500px; width: 100%; border: 4px solid #ffb6c1;
    }
    h1 { color: #ff6b81; margin-bottom: 5px; font-size: 28px; }
    p { color: #777; font-size: 14px; margin-bottom: 20px; }
    .inputs { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
    input {
      width: 45%; padding: 10px; border: 2px solid #ffccd5; border-radius: 12px;
      text-align: center; outline: none; font-size: 15px; background: #fff0f5;
    }
    button {
      background: #ff6b81; color: white; border: none; padding: 12px 24px;
      font-size: 18px; border-radius: 15px; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 0 #d63031; margin-bottom: 15px;
    }
    button:hover { transform: translateY(-2px); background: #ff4757; }
    button:active { transform: translateY(2px); box-shadow: none; }
    #canvas-container { position: relative; margin: 0 auto; display: inline-block; }
    canvas { border-radius: 10px; background: #fafafa; }
    .names-bar, .results-bar { display: flex; justify-content: space-around; width: 100%; margin: 5px 0; }
    .item-btn {
      background: #eccc68; border: 2px solid #ffa502; color: #fff;
      padding: 6px 12px; border-radius: 10px; cursor: pointer; font-size: 14px;
      min-width: 60px; word-break: break-all;
    }
    .result-box {
      background: #dfe4ea; border: 2px solid #a4b0be; color: #2f3542;
      padding: 6px 12px; border-radius: 10px; font-size: 14px;
      min-width: 60px; word-break: break-all;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🐣 사다리 타기 🎲</h1>
  <p>참가자와 결과 항목을 쉼표(,)로 구분해 입력하세요!</p>
  
  <div class="inputs">
    <input type="text" id="names" value="토끼, 곰돌이, 병아리, 강아지">
    <input type="text" id="results" value="당첨, 꽝, 당첨, 꽝">
  </div>
  <button onclick="generateLadder()">사다리 생성하기 ✨</button>

  <div id="game-area" style="display:none;">
    <div class="names-bar" id="names-bar"></div>
    <div id="canvas-container">
      <canvas id="ladderCanvas" width="400" height="300"></canvas>
    </div>
    <div class="results-bar" id="results-bar"></div>
  </div>
</div>

<script>
  let canvas = document.getElementById('ladderCanvas');
  let ctx = canvas.getContext('2d');
  let names = [], results = [];
  let numCols = 0;
  let horizontalLines = [];
  let isAnimating = false;
  const icons = ['🐰', '🐻', '🐥', '🐶', '🐱', '🦊', '🐼', '🐨'];

  function generateLadder() {
    if (isAnimating) return;
    names = document.getElementById('names').value.split(',').map(s => s.trim()).filter(s => s);
    results = document.getElementById('results').value.split(',').map(s => s.trim()).filter(s => s);

    if (names.length < 2 || names.length !== results.length) {
      alert('참가자와 결과의 개수를 동일하게 2개 이상 입력해주세요!');
      return;
    }

    numCols = names.length;
    canvas.width = Math.max(300, numCols * 80);
    document.getElementById('game-area').style.display = 'block';

    // 가로선 생성
    horizontalLines = [];
    const colWidth = canvas.width / numCols;
    for (let i = 0; i < numCols - 1; i++) {
      let count = Math.floor(Math.random() * 3) + 2;
      for (let c = 0; c < count; c++) {
        let y = Math.floor(Math.random() * (canvas.height - 60)) + 30;
        horizontalLines.push({ col: i, y: y });
      }
    }

    renderUI();
    drawLadder();
  }

  function renderUI() {
    const namesBar = document.getElementById('names-bar');
    const resultsBar = document.getElementById('results-bar');
    namesBar.innerHTML = '';
    resultsBar.innerHTML = '';

    names.forEach((name, idx) => {
      let btn = document.createElement('button');
      btn.className = 'item-btn';
      btn.innerText = `${icons[idx % icons.length]} ${name}`;
      btn.onclick = () => startLadder(idx);
      namesBar.appendChild(btn);
    });

    results.forEach((res) => {
      let div = document.createElement('div');
      div.className = 'result-box';
      div.innerText = res;
      resultsBar.appendChild(div);
    });
  }

  function drawLadder() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffb6c1';
    ctx.lineCap = 'round';

    const colWidth = canvas.width / numCols;

    // 세로선
    for (let i = 0; i < numCols; i++) {
      let x = colWidth * i + colWidth / 2;
      ctx.beginPath();
      ctx.moveTo(x, 10);
      ctx.lineTo(x, canvas.height - 10);
      ctx.stroke();
    }

    // 가로선
    ctx.strokeStyle = '#ffccd5';
    horizontalLines.forEach(line => {
      let x1 = colWidth * line.col + colWidth / 2;
      let x2 = colWidth * (line.col + 1) + colWidth / 2;
      ctx.beginPath();
      ctx.moveTo(x1, line.y);
      ctx.lineTo(x2, line.y);
      ctx.stroke();
    });
  }

  function startLadder(startCol) {
    if (isAnimating) return;
    isAnimating = true;

    drawLadder();

    const colWidth = canvas.width / numCols;
    let currCol = startCol;
    let currX = colWidth * currCol + colWidth / 2;
    let currY = 10;

    ctx.lineWidth = 6;
    ctx.strokeStyle = '#ff4757';

    function animate() {
      if (currY >= canvas.height - 10) {
        isAnimating = false;
        return;
      }

      ctx.beginPath();
      ctx.moveTo(currX, currY);

      // 옆으로 연결된 가로선 확인
      let hLineRight = horizontalLines.find(l => l.col === currCol && Math.abs(l.y - currY) < 2);
      let hLineLeft = horizontalLines.find(l => l.col === currCol - 1 && Math.abs(l.y - currY) < 2);

      if (hLineRight) {
        let targetX = colWidth * (currCol + 1) + colWidth / 2;
        currX = targetX;
        currCol++;
      } else if (hLineLeft) {
        let targetX = colWidth * (currCol - 1) + colWidth / 2;
        currX = targetX;
        currCol--;
      }

      currY += 2;
      ctx.lineTo(currX, currY);
      ctx.stroke();

      requestAnimationFrame(animate);
    }

    animate();
  }
</script>

</body>
</html>
